<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- M Gradient Left -->
    <linearGradient id="mGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- M Gradient Right -->
    <linearGradient id="mGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Gold Cap / Crown Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gold Accent Secondary -->
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scaled and Centered for Adaptive Icon Safe Area -->
  <g transform="translate(102, 102) scale(0.8)" filter="url(#shadow)">
    <!-- Left Pillar -->
    <path d="M 210 730 L 210 430 Q 210 390 240 375 L 340 325 Q 370 310 370 345 L 370 730 Q 370 750 350 750 L 230 750 Q 210 750 210 730 Z" 
          fill="url(#mGradLeft)" />

    <!-- Right Pillar -->
    <path d="M 654 345 Q 654 310 684 325 L 784 375 Q 814 390 814 430 L 814 730 Q 814 750 794 750 L 674 750 Q 654 750 654 730 Z" 
          fill="url(#mGradRight)" />

    <!-- Center Left Diagonal Chevron -->
    <path d="M 370 345 L 490 530 Q 512 560 534 530 L 654 345 L 590 345 L 512 470 L 434 345 Z" 
          fill="#38BDF8" opacity="0.9" />

    <!-- Center Deep V Prism -->
    <path d="M 370 420 L 485 595 Q 512 630 539 595 L 654 420 L 654 530 L 530 710 Q 512 735 494 710 L 370 530 Z" 
          fill="url(#mGradLeft)" />

    <!-- Center Target / Star Diamond Accent in "M" -->
    <polygon points="512,470 536,512 578,512 544,538 557,578 512,552 467,578 480,538 446,512 488,512" 
             fill="url(#goldAccent)" filter="url(#glowGold)" />

    <!-- Mortarboard Diamond (Top Cap) -->
    <polygon points="512,170 760,265 512,360 264,265" 
             fill="url(#goldGrad)" />

    <!-- Mortarboard Highlights & Facet Lines -->
    <polygon points="512,170 760,265 512,275 264,265" 
             fill="#FEF08A" opacity="0.6" />
    <polygon points="512,275 760,265 512,360" 
             fill="#D97706" opacity="0.4" />

    <!-- Cap Skull Base / Band -->
    <path d="M 340 295 L 340 355 Q 340 415 512 415 Q 684 415 684 355 L 684 295 Q 512 365 340 295 Z" 
          fill="url(#goldGrad)" />
    <path d="M 340 335 Q 512 415 684 335 L 684 355 Q 684 415 512 415 Q 340 415 340 355 Z" 
          fill="#B45309" />

    <!-- Center Cap Button -->
    <ellipse cx="512" cy="265" rx="18" ry="12" fill="#FEF08A" />

    <!-- Hanging Golden Tassel -->
    <path d="M 512 265 Q 660 280 720 370 L 710 490 Q 725 515 740 490 L 730 370 Q 670 270 512 265 Z" 
          fill="url(#goldAccent)" />
    
    <!-- Tassel Fringe Ring -->
    <rect x="712" y="470" width="26" height="12" rx="4" fill="#FEF08A" />
    <path d="M 712 482 L 702 540 Q 725 560 748 540 L 738 482 Z" fill="url(#goldGrad)" />

    <!-- Sparkle Stars / Master Badge Accents -->
    <polygon points="280,210 288,230 308,238 288,246 280,266 272,246 252,238 272,230" fill="#FEF08A" />
    <polygon points="760,190 766,205 781,211 766,217 760,232 754,217 739,211 754,205" fill="#FEF08A" />
  </g>
</svg>
